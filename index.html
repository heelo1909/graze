<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Graze</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; background: #04050a; overflow: hidden; }
      canvas#game { display: block; width: 100vw; height: 100vh; }
      #ui { position: fixed; inset: 0; pointer-events: none; font-family: "Manrope", "Avenir Next", "Helvetica Neue", system-ui, sans-serif; color: #e8eeff; }
      #ui .screen { pointer-events: auto; position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; text-align: center; background: rgba(4,5,10,0.82); }
      #ui .end { background: rgba(4,5,10,0.94); }
      #ui .title { background: radial-gradient(ellipse at center, rgba(14,18,40,0.92), rgba(4,5,10,0.98)); }
      #ui .logo { margin: 0; font: 800 clamp(48px, 10vw, 96px)/1 "Unbounded", "Avenir Next", system-ui, sans-serif; letter-spacing: 0.06em; color: #fff; }
      #ui .pitch { margin: 0; max-width: 34em; font-weight: 500; color: rgba(232,238,255,0.72); }
      #ui .keys { margin: 0; font-size: 13px; color: rgba(232,238,255,0.5); }
      #ui .field { display: flex; flex-direction: column; gap: 6px; align-items: center; }
      #ui .field-label { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(232,238,255,0.55); }
      #ui input { width: 14em; padding: 10px 14px; text-align: center; font: 700 16px "Manrope", system-ui, sans-serif; color: #fff; background: rgba(255,255,255,0.06); border: 1px solid rgba(77,227,255,0.4); border-radius: 8px; }
      #ui button { font: 700 15px "Manrope", system-ui, sans-serif; color: #e8eeff; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.22); border-radius: 8px; padding: 10px 18px; cursor: pointer; }
      #ui button:hover { background: rgba(255,255,255,0.12); }
      #ui button:focus-visible, #ui input:focus-visible { outline: 2px solid #4de3ff; outline-offset: 3px; }
      #ui .seg { display: flex; gap: 8px; }
      #ui .seg-btn[aria-pressed="true"] { color: #04050a; background: #4de3ff; border-color: #4de3ff; }
      #ui .primary { font-size: 18px; padding: 14px 32px; color: #04050a; background: #4de3ff; border-color: #4de3ff; }
      #ui .primary:hover { background: #8aeeff; }
      #ui .ghost[aria-pressed="true"] { color: rgba(232,238,255,0.55); }
      #ui .winner { margin: 0; font: 800 clamp(30px, 6vw, 56px)/1.1 "Unbounded", system-ui, sans-serif; color: var(--c, #fff); }
      #ui .standings { border-collapse: separate; border-spacing: 28px 8px; font-size: 18px; }
      #ui .standings .nm { text-align: left; font-weight: 800; color: var(--c, #fff); }
      #ui .standings .pts { font-weight: 700; }
      #ui .standings .cut { color: rgba(232,238,255,0.55); font-size: 14px; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
